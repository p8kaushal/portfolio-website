<text x="832" y="443" font-size="14">Plaster: soft, matte, warm variation</text><text x="832" y="468" font-size="14">Oak: readable grain, rounded edges</text><text x="832" y="493" font-size="14">Textile: woven, indigo, tactile</text><text x="832" y="518" font-size="14">Metal: restrained brass highlights</text>
