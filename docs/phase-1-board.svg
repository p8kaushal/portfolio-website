<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
<title id="title">Mumbai creative studio — proposed art direction</title>
<desc id="desc">Original schematic concept board showing warm plaster and oak, indigo seating, layered city windows, amber evening light and the three-room circulation plan. This is a concept illustration, not a screenshot or a finished render.</desc>
