<text x="832" y="751" font-size="18" font-weight="700">Review proposal</text><text x="832" y="780" font-size="14">Keep classic + 2D available.</text><text x="832" y="805" font-size="14">First person; third person for changing.</text><text x="832" y="830" font-size="14">No outdoor traversal or weather changes.</text><text x="832" y="855" font-size="14">All existing interactions retained.</text>
<text x="48" y="900" font-size="11" letter-spacing="1">ORIGINAL SCHEMATIC CONCEPT / NOT A PRODUCTION RENDER / PALETTE, LAYOUT AND BUDGETS AWAIT PHASE REVIEW</text>
